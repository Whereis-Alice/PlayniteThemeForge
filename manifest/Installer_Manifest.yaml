      - Shadow diagnostics now follow derived resources: overriding a brush is reported even when the preset only ships the palette colour it is built from
      - Overrides that merely restate the theme default are reported as having no effect
      - Each finding now states its reason, so it is clear whether a preset is being replaced, masked or not affected at all
